name: JCoin checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js for browser WebCrypto checks
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Run unit and interoperability checks
        run: python -m unittest discover -s tests -v
